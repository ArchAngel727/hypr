env = PATH,$PATH:$HOME/.cargo/bin

# for Qt apps
env = QT_QPA_PLATFORMTHEME,qt6ct

# Cursor
env = XCURSOR_SIZE,96
env = XCURSOR_THEME,Remilia-Scarlet
env = HYPRCURSOR_SIZE,96
env = HYPRCURSOR_THEME,Remilia-Scarlet
exec = gsettings set org.gnome.desktop.interface 'Remilia-Scarlet'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 96

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = __GL_VRR_ALLOWED,1
env = NVD_BACKEND,direct

env = XDG_SESSION_TYPE,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_CURRENT_DESKTOP,Hyprland

