$mainMod = Super 
$terminal = kitty
$fileManager = nautilus

bind = $mainMod, RETURN, exec, kitty -e tmux
bind = $mainMod, C, killactive,
bind = $mainMod Shift, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, ~/.config/rofi/launchers/type-2/launcher.sh
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, W, exec, zen-browser
bind = $mainMod Shift, V, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/launchers/type-2/style-2.rasi | cliphist decode | wl-copy
bind = $mainMod, G, exec, hyprctl dispatch centerwindow
bind = $mainMod, F11, fullscreen
bind = $mainMod, F7, exec, brightnessctl set 1
bind = $mainMod, F8, exec, brightnessctl set 25%
bind = $mainMod, F9, exec, brightnessctl set 50%
bind = , Print, exec, grim - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify "Screenshot of whole screen taken" -t 1000
bind = Shift, Print, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png | dunstify "Screenshot of the region taken" -t 1000

# wallpaper
bind = $mainMod, N, exec, $HOME/.cargo/bin/wppr scrape
bind = $mainMod Shift, N, exec, kitty --class float-center -e $HOME/.cargo/bin/wppr scrape -p
bind = $mainMod Ctrl, N, exec, kitty --class float-center -e $HOME/.cargo/bin/wppr pick
bind = $mainMod Ctrl Shift, N, exec, $HOME/.cargo/bin/wppr reload

# network
bind = $mainMod, F4, exec, nmcli conn up Framework-12
bind = $mainMod, F5, exec, nmcli conn down Framework-12
bind = $mainMod, F10, exec, python ~/.config/hypr/network.py

bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $mainMod Shift, h, movewindow, l
bind = $mainMod Shift, j, movewindow, d
bind = $mainMod Shift, k, movewindow, u
bind = $mainMod Shift, l, movewindow, r

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod Shift, 1, movetoworkspace, 1
bind = $mainMod Shift, 2, movetoworkspace, 2
bind = $mainMod Shift, 3, movetoworkspace, 3
bind = $mainMod Shift, 4, movetoworkspace, 4
bind = $mainMod Shift, 5, movetoworkspace, 5
bind = $mainMod Shift, 6, movetoworkspace, 6
bind = $mainMod Shift, 7, movetoworkspace, 7
bind = $mainMod Shift, 8, movetoworkspace, 8
bind = $mainMod Shift, 9, movetoworkspace, 9
bind = $mainMod Shift, 0, movetoworkspace, 10

bind = $mainMod Ctrl, 1, moveworkspacetomonitor, 1 +1
bind = $mainMod Ctrl, 2, moveworkspacetomonitor, 2 +1
bind = $mainMod Ctrl, 3, moveworkspacetomonitor, 3 +1
bind = $mainMod Ctrl, 4, moveworkspacetomonitor, 4 +1
bind = $mainMod Ctrl, 5, moveworkspacetomonitor, 5 +1
bind = $mainMod Ctrl, 6, moveworkspacetomonitor, 6 +1
bind = $mainMod Ctrl, 7, moveworkspacetomonitor, 7 +1
bind = $mainMod Ctrl, 8, moveworkspacetomonitor, 8 +1
bind = $mainMod Ctrl, 9, moveworkspacetomonitor, 9 +1
bind = $mainMod Ctrl, 0, moveworkspacetomonitor, 10 +1

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod Shift, S, movetoworkspace, special:magic

bind = $mainMod Shift, w, movewindow, mon:+1

bindm = $mainMod Shift, mouse:272, movewindow
bindm = $mainMod Shift, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_SINK@ 5%-

bind = $mainMod, F1, exec, wpctl set-volume @DEFAULT_SINK@ 0%
bind = $mainMod, F2, exec, wpctl set-volume @DEFAULT_SINK@ 50%
bind = $mainMod, F3, exec, wpctl set-volume @DEFAULT_SINK@ 70%

bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bindel=, XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel=, XF86MonBrightnessDown, exec, brightnessctl set 5%-

gesture = 3, horizontal, workspace

bindl = , switch:Lid Switch, exec, hyprlock
